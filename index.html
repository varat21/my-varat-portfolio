<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141310" />
    <meta name="color-scheme" content="light dark" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vt-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (err) {}
      })();
    </script>

    <title>Varat Thapa — Frontend Developer & Product Engineer</title>
    <meta
      name="description"
      content="Portfolio of Varat Thapa, a frontend developer and product engineer based in Kathmandu, Nepal."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Varat Thapa — Frontend Developer & Product Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Varat Thapa, a frontend developer and product engineer based in Kathmandu, Nepal."
    />
    <meta property="og:image" content="/images/og-cover.jpg" />
    <meta property="og:url" content="https://varatthapa.dev" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Varat Thapa — Frontend Developer & Product Engineer" />
    <meta
      name="twitter:description"
      content="Portfolio of Varat Thapa, a frontend developer and product engineer based in Kathmandu, Nepal."
    />
    <meta name="twitter:image" content="/images/og-cover.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
